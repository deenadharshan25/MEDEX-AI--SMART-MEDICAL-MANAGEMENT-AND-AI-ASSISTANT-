version: '3.9'

services:

  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: medai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medaidb
      POSTGRES_USER:     medai
      POSTGRES_PASSWORD: medai_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai -d medaidb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://medai:medai_secure_password@db:5432/medaidb
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend (static serving via nginx) ────────────────────
  frontend:
    image: nginx:alpine
    container_name: medai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
